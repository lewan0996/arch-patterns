name: Template package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-and-generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify installed package and generated Dev Container toolchain
        env:
          ARCH_TEST_CONTAINERS: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Pack the verified source
        run: dotnet pack templates/ArchPatterns.Templates.csproj --configuration Release --output artifacts/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-template-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
