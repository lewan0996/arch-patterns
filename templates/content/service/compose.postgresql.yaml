services:
  database:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: CatalogService
      POSTGRES_USER: CatalogService
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Inject POSTGRES_PASSWORD externally}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U CatalogService -d CatalogService"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  postgres-data:
